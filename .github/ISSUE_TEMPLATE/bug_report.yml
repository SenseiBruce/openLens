name: Bug report
description: Report a reproducible bug
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Steps to reproduce and expected vs actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenLens / voicecut version or commit
    validations:
      required: false
