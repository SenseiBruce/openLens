name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r voicecut/requirements.lock
      - name: Run tests with coverage
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest voicecut/tests/ --maxfail=1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: voicecut/web/package-lock.json
      - name: Install Python lint deps
        run: |
          python -m pip install --upgrade pip
          pip install -r voicecut/requirements.txt
          ruff check voicecut/
      - name: Lint and build frontend
        working-directory: voicecut/web
        run: |
          npm ci
          npm run build
          npx eslint src
          npm test
