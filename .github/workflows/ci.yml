name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: voicecut/requirements.lock
      - name: Verify Python lockfile is in sync
        run: |
          python -m pip install --upgrade pip pip-tools
          cp voicecut/requirements.lock /tmp/committed.lock
          pip-compile --generate-hashes --output-file=voicecut/requirements.lock --strip-extras voicecut/requirements.txt
          diff -u /tmp/committed.lock voicecut/requirements.lock
      - name: Install Python dependencies
        run: pip install -r voicecut/requirements.lock
      - name: Run tests with coverage
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest voicecut/tests/ --maxfail=1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: voicecut/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: voicecut/web/package-lock.json
      - name: Ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r voicecut/requirements.lock
          ruff check voicecut/
      - name: Frontend install, typecheck, lint, test, build
        working-directory: voicecut/web
        run: |
          npm ci
          npm run typecheck
          npx eslint src
          npm test
          npm run build
      - name: npm audit (high+)
        working-directory: voicecut/web
        run: npm audit --audit-level=high

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: voicecut/requirements.lock
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r voicecut/requirements.lock
