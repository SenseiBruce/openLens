# Rust Project Configuration Template
# Version: 1.0
# Last Updated: 2026-02-09
# Description: Zero hardcoded values configuration for Rust projects
# Usage: Copy and customize for each Rust project in AgentBase

# ============================================================================
# PROJECT METADATA
# ============================================================================
project:
  id: "${PROJECT_ID}"  # Unique project identifier (e.g., proj_20260209_154530)
  name: "${PROJECT_NAME}"  # Human-readable project name
  type: "${PROJECT_TYPE}"  # POC | Prototype | MVP | Production | Handover
  language: "rust"
  rust_version: "${RUST_VERSION}"  # 1.75 | 1.76 | stable | beta | nightly
  edition: "${RUST_EDITION}"  # 2015 | 2018 | 2021 | 2024
  framework: "${RUST_FRAMEWORK}"  # actix-web | rocket | axum | tokio | none
  version: "${PROJECT_VERSION}"  # Semantic versioning (e.g., 1.0.0)
  description: "${PROJECT_DESCRIPTION}"
  created_date: "${PROJECT_CREATED_DATE}"  # ISO 8601 format
  owner: "${PROJECT_OWNER}"
  team_size: ${TEAM_SIZE}  # Number of agents assigned
  priority: "${PROJECT_PRIORITY}"  # low | medium | high | critical

# ============================================================================
# AGENT SETTINGS
# ============================================================================
agents:
  orchestrator:
    enabled: true
    role: "Project Lifecycle Manager"
    authority_level: "full"
    
  development:
    backend_developer:
      enabled: ${BACKEND_AGENT_ENABLED}
      role: "Back-End Developer"
      responsibilities:
        - "Core library development"
        - "Performance optimization"
        - "Concurrency implementation"
    
    frontend_developer:
      enabled: ${FRONTEND_AGENT_ENABLED}
      role: "Front-End Developer"
      responsibilities:
        - "WASM development"
        - "UI implementation"
    
  architecture:
    technical_architect:
      enabled: ${ARCHITECT_AGENT_ENABLED}
      role: "Technical Architect"
      consultation_required: ${ARCHITECT_CONSULTATION_REQUIRED}
      
    database_architect:
      enabled: ${DB_ARCHITECT_AGENT_ENABLED}
      role: "Database Architect"
      consultation_required: ${DB_ARCHITECT_CONSULTATION_REQUIRED}
      
  operations:
    devops_engineer:
      enabled: ${DEVOPS_AGENT_ENABLED}
      role: "DevOps Engineer"
      
    security_engineer:
      enabled: ${SECURITY_AGENT_ENABLED}
      role: "Security Engineer"
      consultation_required: true
      
  quality:
    qa_engineer:
      enabled: ${QA_AGENT_ENABLED}
      role: "QA-Test Engineer"
      
  data:
    data_engineer:
      enabled: ${DATA_ENGINEER_ENABLED}
      role: "Data Engineer"
      
    data_scientist:
      enabled: ${DATA_SCIENTIST_ENABLED}
      role: "Data Scientist"

# ============================================================================
# PHASE DEFINITIONS
# ============================================================================
phases:
  phase_1_planning:
    name: "Planning & Requirements"
    duration_estimate: "${PHASE_1_DURATION}"
    deliverables:
      - "${DELIVERABLE_PRD}"
      - "${DELIVERABLE_CHARTER}"
      - "${DELIVERABLE_ARCHITECTURE}"
    agents_required:
      - "Project Lifecycle Manager"
      - "${PHASE_1_AGENT_1}"
      - "${PHASE_1_AGENT_2}"
      
  phase_2_design:
    name: "Design & Architecture"
    duration_estimate: "${PHASE_2_DURATION}"
    deliverables:
      - "${DELIVERABLE_SYSTEM_DESIGN}"
      - "${DELIVERABLE_MODULE_STRUCTURE}"
      - "${DELIVERABLE_API_SPEC}"
    agents_required:
      - "Technical Architect"
      - "${PHASE_2_AGENT_1}"
      
  phase_3_implementation:
    name: "Implementation"
    duration_estimate: "${PHASE_3_DURATION}"
    deliverables:
      - "${DELIVERABLE_SOURCE_CODE}"
      - "${DELIVERABLE_TESTS}"
      - "${DELIVERABLE_DOCUMENTATION}"
    agents_required:
      - "Back-End Developer"
      - "${PHASE_3_AGENT_1}"
      - "${PHASE_3_AGENT_2}"
      
  phase_4_testing:
    name: "Testing & QA"
    duration_estimate: "${PHASE_4_DURATION}"
    deliverables:
      - "${DELIVERABLE_TEST_RESULTS}"
      - "${DELIVERABLE_QA_REPORT}"
      - "${DELIVERABLE_BENCHMARK_RESULTS}"
    agents_required:
      - "QA-Test Engineer"
      
  phase_5_deployment:
    name: "Deployment & Handover"
    duration_estimate: "${PHASE_5_DURATION}"
    deliverables:
      - "${DELIVERABLE_DEPLOYMENT_GUIDE}"
      - "${DELIVERABLE_RUNBOOK}"
    agents_required:
      - "DevOps Engineer"

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
environments:
  development:
    name: "dev"
    rust_version: "${RUST_VERSION_DEV}"
    profile: "dev"
    opt_level: ${OPT_LEVEL_DEV}  # 0 | 1 | 2 | 3
    debug: ${DEBUG_DEV}
    debug_assertions: ${DEBUG_ASSERTIONS_DEV}
    overflow_checks: ${OVERFLOW_CHECKS_DEV}
    lto: "${LTO_DEV}"  # false | thin | fat
    log_level: "${LOG_LEVEL_DEV}"  # trace | debug | info | warn | error
    database_url: "${DATABASE_URL_DEV}"
    api_base_url: "${API_BASE_URL_DEV}"
    
  staging:
    name: "staging"
    rust_version: "${RUST_VERSION_STAGING}"
    profile: "release"
    opt_level: ${OPT_LEVEL_STAGING}
    debug: ${DEBUG_STAGING}
    debug_assertions: ${DEBUG_ASSERTIONS_STAGING}
    overflow_checks: ${OVERFLOW_CHECKS_STAGING}
    lto: "${LTO_STAGING}"
    log_level: "${LOG_LEVEL_STAGING}"
    database_url: "${DATABASE_URL_STAGING}"
    api_base_url: "${API_BASE_URL_STAGING}"
    
  production:
    name: "prod"
    rust_version: "${RUST_VERSION_PROD}"
    profile: "release"
    opt_level: 3
    debug: false
    debug_assertions: false
    overflow_checks: false
    lto: "fat"
    log_level: "${LOG_LEVEL_PROD}"  # Should be warn or error
    database_url: "${DATABASE_URL_PROD}"
    api_base_url: "${API_BASE_URL_PROD}"

# ============================================================================
# BUILD SETTINGS
# ============================================================================
build:
  build_tool: "cargo"
  manifest_file: "${CARGO_TOML_PATH}"
  lock_file: "${CARGO_LOCK_PATH}"
  
  cargo:
    target_dir: "${CARGO_TARGET_DIR}"
    features: "${CARGO_FEATURES}"
    default_features: ${CARGO_DEFAULT_FEATURES}
    all_features: ${CARGO_ALL_FEATURES}
    no_default_features: ${CARGO_NO_DEFAULT_FEATURES}
    
  compiler:
    target: "${RUST_TARGET}"  # x86_64-unknown-linux-gnu | wasm32-unknown-unknown
    flags: "${RUSTFLAGS}"
    codegen_units: ${CODEGEN_UNITS}
    incremental: ${INCREMENTAL_COMPILATION}
    
  profile:
    release:
      opt_level: ${RELEASE_OPT_LEVEL}  # 3 | "s" | "z"
      lto: "${RELEASE_LTO}"
      codegen_units: ${RELEASE_CODEGEN_UNITS}
      panic: "${RELEASE_PANIC}"  # unwind | abort
      strip: ${RELEASE_STRIP}  # true | false | "symbols"
      
  static_analysis:
    clippy:
      enabled: ${CLIPPY_ENABLED}
      warn_level: "${CLIPPY_WARN_LEVEL}"  # all | pedantic | nursery | cargo
      deny_warnings: ${CLIPPY_DENY_WARNINGS}
      
    rustfmt:
      enabled: ${RUSTFMT_ENABLED}
      config_file: "${RUSTFMT_CONFIG_PATH}"
      edition: "${RUSTFMT_EDITION}"
      
    cargo_audit:
      enabled: ${CARGO_AUDIT_ENABLED}
      deny_warnings: ${AUDIT_DENY_WARNINGS}
      
    miri:
      enabled: ${MIRI_ENABLED}  # Undefined behavior detector
      
  cross_compilation:
    enabled: ${CROSS_COMPILE_ENABLED}
    targets:
      - "${CROSS_TARGET_1}"
      - "${CROSS_TARGET_2}"
      
  pre_build_commands:
    - "${PRE_BUILD_CMD_1}"
    - "${PRE_BUILD_CMD_2}"
    
  post_build_commands:
    - "${POST_BUILD_CMD_1}"
    - "${POST_BUILD_CMD_2}"

# ============================================================================
# TESTING CONFIGURATION
# ============================================================================
testing:
  framework: "cargo-test"  # Built-in Rust testing
  
  coverage:
    tool: "${COVERAGE_TOOL}"  # tarpaulin | llvm-cov | grcov
    
    # Coverage requirements by project type
    requirements:
      POC: ${COVERAGE_POC}  # 85%
      Prototype: ${COVERAGE_PROTOTYPE}  # 90%
      MVP: ${COVERAGE_MVP}  # 95%
      Production: ${COVERAGE_PRODUCTION}  # 95%
      Handover: ${COVERAGE_HANDOVER}  # 95%
      
    current_requirement: ${COVERAGE_CURRENT_REQUIREMENT}
    report_format: "${COVERAGE_REPORT_FORMAT}"  # html | lcov | cobertura
    output_dir: "${COVERAGE_OUTPUT_DIR}"
    
  unit_tests:
    directory: "${UNIT_TEST_DIR}"  # Typically inline in src/
    pattern: "${UNIT_TEST_PATTERN}"  # #[test] | #[cfg(test)]
    parallel_execution: ${UNIT_TEST_PARALLEL}
    
  integration_tests:
    directory: "${INTEGRATION_TEST_DIR}"  # tests/
    pattern: "${INTEGRATION_TEST_PATTERN}"
    requires_database: ${INTEGRATION_TEST_DB_REQUIRED}
    
  doc_tests:
    enabled: ${DOC_TEST_ENABLED}
    
  benchmark_tests:
    enabled: ${BENCHMARK_TEST_ENABLED}
    directory: "${BENCHMARK_DIR}"  # benches/
    tool: "${BENCHMARK_TOOL}"  # criterion | bencher
    
  property_tests:
    enabled: ${PROPERTY_TEST_ENABLED}
    library: "${PROPERTY_TEST_LIBRARY}"  # proptest | quickcheck
    
  mocking:
    library: "${MOCKING_LIBRARY}"  # mockall | mockers

# ============================================================================
# DEPLOYMENT CONFIGURATION
# ============================================================================
deployment:
  platform: "${DEPLOYMENT_PLATFORM}"  # linux | docker | kubernetes | aws-lambda
  
  containerization:
    enabled: ${DOCKER_ENABLED}
    dockerfile_path: "${DOCKERFILE_PATH}"
    base_image: "${DOCKER_BASE_IMAGE}"  # rust:1.76-alpine | scratch
    image_name: "${DOCKER_IMAGE_NAME}"
    image_tag: "${DOCKER_IMAGE_TAG}"
    registry_url: "${DOCKER_REGISTRY_URL}"
    multi_stage_build: ${DOCKER_MULTI_STAGE}
    
  orchestration:
    tool: "${ORCHESTRATION_TOOL}"  # kubernetes | docker-compose
    config_path: "${ORCHESTRATION_CONFIG_PATH}"
    
  binary:
    type: "${BINARY_TYPE}"  # bin | lib | cdylib | staticlib
    name: "${BINARY_NAME}"
    install_path: "${BINARY_INSTALL_PATH}"
    strip_symbols: ${STRIP_SYMBOLS}
    upx_compression: ${UPX_COMPRESSION}
    
  static_binary:
    enabled: ${STATIC_BINARY_ENABLED}
    target: "${STATIC_TARGET}"  # x86_64-unknown-linux-musl
    
  systemd:
    enabled: ${SYSTEMD_ENABLED}
    service_file: "${SYSTEMD_SERVICE_FILE}"
    
  health_check:
    endpoint: "${HEALTH_CHECK_ENDPOINT}"
    interval: ${HEALTH_CHECK_INTERVAL}
    timeout: ${HEALTH_CHECK_TIMEOUT}

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging:
  base_directory: "logs/${PROJECT_ID}"
  
  phase_logging:
    enabled: true
    pattern: "logs/${PROJECT_ID}/phase_${PHASE_NUMBER}_${PHASE_NAME}/"
    
  library: "${LOGGING_LIBRARY}"  # tracing | log | env_logger | slog
  
  levels:
    root: "${LOG_LEVEL_ROOT}"
    app: "${LOG_LEVEL_APP}"
    database: "${LOG_LEVEL_DATABASE}"
    external_apis: "${LOG_LEVEL_EXTERNAL_APIS}"
    
  handlers:
    console:
      enabled: ${LOG_CONSOLE_ENABLED}
      format: "${LOG_CONSOLE_FORMAT}"  # compact | pretty | json
      ansi_colors: ${LOG_CONSOLE_COLORS}
      
    file:
      enabled: ${LOG_FILE_ENABLED}
      path: "${LOG_FILE_PATH}"
      format: "${LOG_FILE_FORMAT}"
      rotation: "${LOG_FILE_ROTATION}"  # daily | size-based | hourly
      max_size: "${LOG_FILE_MAX_SIZE}"  # e.g., 10MB
      backup_count: ${LOG_FILE_BACKUP_COUNT}
      
    syslog:
      enabled: ${LOG_SYSLOG_ENABLED}
      host: "${LOG_SYSLOG_HOST}"
      port: ${LOG_SYSLOG_PORT}
      
  structured_logging:
    enabled: ${STRUCTURED_LOGGING_ENABLED}
    format: "${STRUCTURED_LOG_FORMAT}"  # json | logfmt
    
  tracing:
    enabled: ${TRACING_ENABLED}
    span_events: "${TRACING_SPAN_EVENTS}"  # new | close | full
    instrumentation: ${TRACING_INSTRUMENTATION}

# ============================================================================
# SECURITY SETTINGS
# ============================================================================
security:
  dependency_scanning:
    tool: "${DEPENDENCY_SCAN_TOOL}"  # cargo-audit | cargo-deny
    schedule: "${DEPENDENCY_SCAN_SCHEDULE}"
    fail_on_vulnerability: ${FAIL_ON_VULNERABILITY}
    
  static_application_security_testing:
    tool: "${SAST_TOOL}"  # cargo-geiger | rudra
    config_path: "${SAST_CONFIG_PATH}"
    severity_threshold: "${SAST_SEVERITY_THRESHOLD}"  # low | medium | high
    
  secrets_management:
    provider: "${SECRETS_PROVIDER}"  # vault | aws-secrets | azure-keyvault | env
    config_path: "${SECRETS_CONFIG_PATH}"
    rotation_enabled: ${SECRETS_ROTATION_ENABLED}
    
  memory_safety:
    unsafe_code_forbidden: ${UNSAFE_CODE_FORBIDDEN}
    check_unsafe_blocks: ${CHECK_UNSAFE_BLOCKS}
    
  authentication:
    method: "${AUTH_METHOD}"  # jwt | oauth2 | api-key
    token_expiry: ${AUTH_TOKEN_EXPIRY}
    
  cors:
    enabled: ${CORS_ENABLED}
    allowed_origins: "${CORS_ALLOWED_ORIGINS}"
    allowed_methods: "${CORS_ALLOWED_METHODS}"
    
  rate_limiting:
    enabled: ${RATE_LIMITING_ENABLED}
    requests_per_minute: ${RATE_LIMIT_RPM}
    
  input_validation:
    library: "${INPUT_VALIDATION_LIBRARY}"  # validator | garde
    strict_mode: ${INPUT_VALIDATION_STRICT}

# ============================================================================
# CODE QUALITY SETTINGS
# ============================================================================
code_quality:
  formatting:
    tool: "rustfmt"
    config_file: "${RUSTFMT_CONFIG}"
    check_only: ${FORMAT_CHECK_ONLY}
    
  linting:
    enabled: ${LINTING_ENABLED}
    tools:
      - "clippy"
      - "${LINTING_TOOL_2}"
    fail_on_error: ${LINT_FAIL_ON_ERROR}
    
  complexity:
    max_complexity: ${MAX_COMPLEXITY}  # Cyclomatic complexity
    max_function_length: ${MAX_FUNCTION_LENGTH}
    max_struct_fields: ${MAX_STRUCT_FIELDS}
    
  documentation:
    format: "rustdoc"
    min_coverage: ${MIN_DOCUMENTATION_COVERAGE}
    missing_docs: "${MISSING_DOCS_LEVEL}"  # allow | warn | deny
    
  naming_conventions:
    enforce_snake_case: ${ENFORCE_SNAKE_CASE}
    enforce_camel_case: ${ENFORCE_CAMEL_CASE}
    enforce_screaming_snake_case: ${ENFORCE_SCREAMING_SNAKE_CASE}

# ============================================================================
# DOCUMENTATION PATHS
# ============================================================================
documentation:
  root_directory: "${DOCS_ROOT_DIR}"
  
  project_docs:
    readme: "${README_PATH}"
    changelog: "${CHANGELOG_PATH}"
    contributing: "${CONTRIBUTING_PATH}"
    license: "${LICENSE_PATH}"
    
  technical_docs:
    architecture: "${ARCHITECTURE_DOC_PATH}"
    api_reference: "${API_REFERENCE_PATH}"
    module_structure: "${MODULE_STRUCTURE_PATH}"
    deployment_guide: "${DEPLOYMENT_GUIDE_PATH}"
    
  user_docs:
    user_guide: "${USER_GUIDE_PATH}"
    installation: "${INSTALLATION_DOC_PATH}"
    troubleshooting: "${TROUBLESHOOTING_PATH}"
    
  code_docs:
    auto_generate: ${AUTO_GENERATE_DOCS}
    tool: "cargo-doc"
    output_format: "${DOCS_OUTPUT_FORMAT}"  # html
    output_directory: "${DOCS_OUTPUT_DIR}"
    private_items: ${DOCS_INCLUDE_PRIVATE}

# ============================================================================
# SECRETS PLACEHOLDERS
# ============================================================================
# DO NOT STORE ACTUAL SECRETS IN THIS FILE
# Reference secrets from secure storage (environment variables, vault, etc.)
secrets:
  database:
    url: "${DATABASE_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    host: "${DB_HOST}"
    port: ${DB_PORT}
    name: "${DB_NAME}"
    
  api_keys:
    third_party_service_1: "${API_KEY_SERVICE_1}"
    third_party_service_2: "${API_KEY_SERVICE_2}"
    
  authentication:
    secret_key: "${AUTH_SECRET_KEY}"
    jwt_secret: "${JWT_SECRET_KEY}"
    
  cloud_provider:
    access_key_id: "${CLOUD_ACCESS_KEY_ID}"
    secret_access_key: "${CLOUD_SECRET_ACCESS_KEY}"
    region: "${CLOUD_REGION}"
    
  encryption:
    encryption_key: "${ENCRYPTION_KEY}"
    private_key: "${PRIVATE_KEY}"
    certificate: "${CERTIFICATE}"
    
  external_services:
    service_endpoint: "${EXTERNAL_SERVICE_ENDPOINT}"
    service_token: "${EXTERNAL_SERVICE_TOKEN}"

# ============================================================================
# END OF CONFIGURATION
# ============================================================================
