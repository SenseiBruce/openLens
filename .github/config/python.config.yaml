# Python Project Configuration Template
# Version: 1.0
# Last Updated: 2026-02-09
# Description: Zero hardcoded values configuration for Python projects
# Usage: Copy and customize for each Python project in AgentBase

# ============================================================================
# PROJECT METADATA
# ============================================================================
project:
  id: "${PROJECT_ID}"  # Unique project identifier (e.g., proj_20260209_154530)
  name: "${PROJECT_NAME}"  # Human-readable project name
  type: "${PROJECT_TYPE}"  # POC | Prototype | MVP | Production | Handover
  language: "python"
  framework: "${PYTHON_FRAMEWORK}"  # django | flask | fastapi | streamlit | none
  version: "${PROJECT_VERSION}"  # Semantic versioning (e.g., 1.0.0)
  description: "${PROJECT_DESCRIPTION}"
  created_date: "${PROJECT_CREATED_DATE}"  # ISO 8601 format
  owner: "${PROJECT_OWNER}"
  team_size: ${TEAM_SIZE}  # Number of agents assigned
  priority: "${PROJECT_PRIORITY}"  # low | medium | high | critical

# ============================================================================
# AGENT SETTINGS
# ============================================================================
agents:
  orchestrator:
    enabled: true
    role: "Project Lifecycle Manager"
    authority_level: "full"
    
  development:
    backend_developer:
      enabled: ${BACKEND_AGENT_ENABLED}
      role: "Back-End Developer"
      responsibilities:
        - "API development"
        - "Business logic implementation"
        - "Database integration"
    
    frontend_developer:
      enabled: ${FRONTEND_AGENT_ENABLED}
      role: "Front-End Developer"
      responsibilities:
        - "UI implementation"
        - "Client-side logic"
    
  architecture:
    technical_architect:
      enabled: ${ARCHITECT_AGENT_ENABLED}
      role: "Technical Architect"
      consultation_required: ${ARCHITECT_CONSULTATION_REQUIRED}
      
    database_architect:
      enabled: ${DB_ARCHITECT_AGENT_ENABLED}
      role: "Database Architect"
      consultation_required: ${DB_ARCHITECT_CONSULTATION_REQUIRED}
      
  operations:
    devops_engineer:
      enabled: ${DEVOPS_AGENT_ENABLED}
      role: "DevOps Engineer"
      
    security_engineer:
      enabled: ${SECURITY_AGENT_ENABLED}
      role: "Security Engineer"
      consultation_required: true
      
  quality:
    qa_engineer:
      enabled: ${QA_AGENT_ENABLED}
      role: "QA-Test Engineer"
      
  data:
    data_engineer:
      enabled: ${DATA_ENGINEER_ENABLED}
      role: "Data Engineer"
      
    data_scientist:
      enabled: ${DATA_SCIENTIST_ENABLED}
      role: "Data Scientist"

# ============================================================================
# PHASE DEFINITIONS
# ============================================================================
phases:
  phase_1_planning:
    name: "Planning & Requirements"
    duration_estimate: "${PHASE_1_DURATION}"
    deliverables:
      - "${DELIVERABLE_PRD}"
      - "${DELIVERABLE_CHARTER}"
      - "${DELIVERABLE_ARCHITECTURE}"
    agents_required:
      - "Project Lifecycle Manager"
      - "${PHASE_1_AGENT_1}"
      - "${PHASE_1_AGENT_2}"
      
  phase_2_design:
    name: "Design & Architecture"
    duration_estimate: "${PHASE_2_DURATION}"
    deliverables:
      - "${DELIVERABLE_SYSTEM_DESIGN}"
      - "${DELIVERABLE_DB_SCHEMA}"
      - "${DELIVERABLE_API_SPEC}"
    agents_required:
      - "Technical Architect"
      - "${PHASE_2_AGENT_1}"
      
  phase_3_implementation:
    name: "Implementation"
    duration_estimate: "${PHASE_3_DURATION}"
    deliverables:
      - "${DELIVERABLE_SOURCE_CODE}"
      - "${DELIVERABLE_TESTS}"
      - "${DELIVERABLE_DOCUMENTATION}"
    agents_required:
      - "Back-End Developer"
      - "${PHASE_3_AGENT_1}"
      - "${PHASE_3_AGENT_2}"
      
  phase_4_testing:
    name: "Testing & QA"
    duration_estimate: "${PHASE_4_DURATION}"
    deliverables:
      - "${DELIVERABLE_TEST_RESULTS}"
      - "${DELIVERABLE_QA_REPORT}"
    agents_required:
      - "QA-Test Engineer"
      
  phase_5_deployment:
    name: "Deployment & Handover"
    duration_estimate: "${PHASE_5_DURATION}"
    deliverables:
      - "${DELIVERABLE_DEPLOYMENT_GUIDE}"
      - "${DELIVERABLE_RUNBOOK}"
    agents_required:
      - "DevOps Engineer"

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
environments:
  development:
    name: "dev"
    python_version: "${PYTHON_VERSION_DEV}"  # e.g., 3.11
    virtual_env_path: "${VENV_PATH_DEV}"
    pip_index_url: "${PIP_INDEX_URL_DEV}"
    debug_mode: ${DEBUG_MODE_DEV}
    log_level: "${LOG_LEVEL_DEV}"  # DEBUG | INFO | WARNING | ERROR
    database_url: "${DATABASE_URL_DEV}"
    redis_url: "${REDIS_URL_DEV}"
    api_base_url: "${API_BASE_URL_DEV}"
    
  staging:
    name: "staging"
    python_version: "${PYTHON_VERSION_STAGING}"
    virtual_env_path: "${VENV_PATH_STAGING}"
    pip_index_url: "${PIP_INDEX_URL_STAGING}"
    debug_mode: ${DEBUG_MODE_STAGING}
    log_level: "${LOG_LEVEL_STAGING}"
    database_url: "${DATABASE_URL_STAGING}"
    redis_url: "${REDIS_URL_STAGING}"
    api_base_url: "${API_BASE_URL_STAGING}"
    
  production:
    name: "prod"
    python_version: "${PYTHON_VERSION_PROD}"
    virtual_env_path: "${VENV_PATH_PROD}"
    pip_index_url: "${PIP_INDEX_URL_PROD}"
    debug_mode: false
    log_level: "${LOG_LEVEL_PROD}"  # Should be WARNING or ERROR
    database_url: "${DATABASE_URL_PROD}"
    redis_url: "${REDIS_URL_PROD}"
    api_base_url: "${API_BASE_URL_PROD}"

# ============================================================================
# BUILD SETTINGS
# ============================================================================
build:
  package_manager: "pip"  # pip | poetry | pipenv
  requirements_file: "${REQUIREMENTS_FILE_PATH}"  # requirements.txt | pyproject.toml
  
  dependencies:
    install_command: "${PIP_INSTALL_COMMAND}"
    upgrade_command: "${PIP_UPGRADE_COMMAND}"
    freeze_command: "${PIP_FREEZE_COMMAND}"
    
  virtual_environment:
    create_command: "${VENV_CREATE_COMMAND}"
    activate_path: "${VENV_ACTIVATE_PATH}"
    
  static_analysis:
    pylint:
      enabled: ${PYLINT_ENABLED}
      config_file: "${PYLINT_CONFIG_PATH}"
      min_score: ${PYLINT_MIN_SCORE}
      
    mypy:
      enabled: ${MYPY_ENABLED}
      config_file: "${MYPY_CONFIG_PATH}"
      strict_mode: ${MYPY_STRICT_MODE}
      
    black:
      enabled: ${BLACK_ENABLED}
      line_length: ${BLACK_LINE_LENGTH}
      
    isort:
      enabled: ${ISORT_ENABLED}
      profile: "${ISORT_PROFILE}"  # black | django | google
      
  pre_build_commands:
    - "${PRE_BUILD_CMD_1}"
    - "${PRE_BUILD_CMD_2}"
    
  post_build_commands:
    - "${POST_BUILD_CMD_1}"
    - "${POST_BUILD_CMD_2}"

# ============================================================================
# TESTING CONFIGURATION
# ============================================================================
testing:
  framework: "${TEST_FRAMEWORK}"  # pytest | unittest | nose2
  
  coverage:
    tool: "pytest-cov"
    
    # Coverage requirements by project type
    requirements:
      POC: ${COVERAGE_POC}  # 85%
      Prototype: ${COVERAGE_PROTOTYPE}  # 90%
      MVP: ${COVERAGE_MVP}  # 95%
      Production: ${COVERAGE_PRODUCTION}  # 95%
      Handover: ${COVERAGE_HANDOVER}  # 95%
      
    current_requirement: ${COVERAGE_CURRENT_REQUIREMENT}
    report_format: "${COVERAGE_REPORT_FORMAT}"  # html | xml | term
    output_dir: "${COVERAGE_OUTPUT_DIR}"
    
  unit_tests:
    directory: "${UNIT_TEST_DIR}"
    pattern: "${UNIT_TEST_PATTERN}"  # test_*.py
    parallel_execution: ${UNIT_TEST_PARALLEL}
    
  integration_tests:
    directory: "${INTEGRATION_TEST_DIR}"
    pattern: "${INTEGRATION_TEST_PATTERN}"
    requires_database: ${INTEGRATION_TEST_DB_REQUIRED}
    
  performance_tests:
    enabled: ${PERFORMANCE_TEST_ENABLED}
    directory: "${PERFORMANCE_TEST_DIR}"
    
  fixtures:
    directory: "${FIXTURES_DIR}"
    
  mocking:
    library: "${MOCKING_LIBRARY}"  # unittest.mock | pytest-mock

# ============================================================================
# DEPLOYMENT CONFIGURATION
# ============================================================================
deployment:
  platform: "${DEPLOYMENT_PLATFORM}"  # aws | gcp | azure | heroku | docker
  
  containerization:
    enabled: ${DOCKER_ENABLED}
    dockerfile_path: "${DOCKERFILE_PATH}"
    image_name: "${DOCKER_IMAGE_NAME}"
    image_tag: "${DOCKER_IMAGE_TAG}"
    registry_url: "${DOCKER_REGISTRY_URL}"
    
  orchestration:
    tool: "${ORCHESTRATION_TOOL}"  # kubernetes | docker-compose | ecs
    config_path: "${ORCHESTRATION_CONFIG_PATH}"
    
  application_server:
    type: "${APP_SERVER_TYPE}"  # gunicorn | uvicorn | waitress
    workers: ${APP_SERVER_WORKERS}
    host: "${APP_SERVER_HOST}"
    port: ${APP_SERVER_PORT}
    timeout: ${APP_SERVER_TIMEOUT}
    
  static_files:
    enabled: ${STATIC_FILES_ENABLED}
    directory: "${STATIC_FILES_DIR}"
    url_path: "${STATIC_FILES_URL_PATH}"
    
  database_migrations:
    tool: "${MIGRATION_TOOL}"  # alembic | django | flask-migrate
    directory: "${MIGRATIONS_DIR}"
    auto_migrate: ${AUTO_MIGRATE_ENABLED}
    
  health_check:
    endpoint: "${HEALTH_CHECK_ENDPOINT}"
    interval: ${HEALTH_CHECK_INTERVAL}
    timeout: ${HEALTH_CHECK_TIMEOUT}

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging:
  base_directory: "logs/${PROJECT_ID}"
  
  phase_logging:
    enabled: true
    pattern: "logs/${PROJECT_ID}/phase_${PHASE_NUMBER}_${PHASE_NAME}/"
    
  levels:
    root: "${LOG_LEVEL_ROOT}"
    app: "${LOG_LEVEL_APP}"
    database: "${LOG_LEVEL_DATABASE}"
    external_apis: "${LOG_LEVEL_EXTERNAL_APIS}"
    
  handlers:
    console:
      enabled: ${LOG_CONSOLE_ENABLED}
      format: "${LOG_CONSOLE_FORMAT}"
      
    file:
      enabled: ${LOG_FILE_ENABLED}
      path: "${LOG_FILE_PATH}"
      format: "${LOG_FILE_FORMAT}"
      rotation: "${LOG_FILE_ROTATION}"  # daily | size-based
      max_size: "${LOG_FILE_MAX_SIZE}"  # e.g., 10MB
      backup_count: ${LOG_FILE_BACKUP_COUNT}
      
    syslog:
      enabled: ${LOG_SYSLOG_ENABLED}
      host: "${LOG_SYSLOG_HOST}"
      port: ${LOG_SYSLOG_PORT}
      
  structured_logging:
    enabled: ${STRUCTURED_LOGGING_ENABLED}
    format: "${STRUCTURED_LOG_FORMAT}"  # json | logfmt
    
  correlation_id:
    enabled: ${CORRELATION_ID_ENABLED}
    header_name: "${CORRELATION_ID_HEADER}"

# ============================================================================
# SECURITY SETTINGS
# ============================================================================
security:
  dependency_scanning:
    tool: "${DEPENDENCY_SCAN_TOOL}"  # safety | pip-audit | snyk
    schedule: "${DEPENDENCY_SCAN_SCHEDULE}"
    fail_on_vulnerability: ${FAIL_ON_VULNERABILITY}
    
  static_application_security_testing:
    tool: "${SAST_TOOL}"  # bandit | semgrep
    config_path: "${SAST_CONFIG_PATH}"
    severity_threshold: "${SAST_SEVERITY_THRESHOLD}"  # low | medium | high
    
  secrets_management:
    provider: "${SECRETS_PROVIDER}"  # vault | aws-secrets | azure-keyvault | env
    config_path: "${SECRETS_CONFIG_PATH}"
    rotation_enabled: ${SECRETS_ROTATION_ENABLED}
    
  authentication:
    method: "${AUTH_METHOD}"  # jwt | oauth2 | api-key
    token_expiry: ${AUTH_TOKEN_EXPIRY}
    
  cors:
    enabled: ${CORS_ENABLED}
    allowed_origins: "${CORS_ALLOWED_ORIGINS}"
    allowed_methods: "${CORS_ALLOWED_METHODS}"
    
  rate_limiting:
    enabled: ${RATE_LIMITING_ENABLED}
    requests_per_minute: ${RATE_LIMIT_RPM}
    
  input_validation:
    library: "${INPUT_VALIDATION_LIBRARY}"  # pydantic | marshmallow | cerberus
    strict_mode: ${INPUT_VALIDATION_STRICT}

# ============================================================================
# CODE QUALITY SETTINGS
# ============================================================================
code_quality:
  formatting:
    tool: "black"
    line_length: ${CODE_LINE_LENGTH}
    check_only: ${FORMAT_CHECK_ONLY}
    
  linting:
    enabled: ${LINTING_ENABLED}
    tools:
      - "${LINTING_TOOL_1}"
      - "${LINTING_TOOL_2}"
    fail_on_error: ${LINT_FAIL_ON_ERROR}
    
  complexity:
    max_complexity: ${MAX_COMPLEXITY}  # McCabe complexity
    max_function_length: ${MAX_FUNCTION_LENGTH}
    max_file_length: ${MAX_FILE_LENGTH}
    
  documentation:
    docstring_style: "${DOCSTRING_STYLE}"  # google | numpy | sphinx
    min_docstring_coverage: ${MIN_DOCSTRING_COVERAGE}
    
  imports:
    sort_tool: "isort"
    remove_unused: ${REMOVE_UNUSED_IMPORTS}

# ============================================================================
# DOCUMENTATION PATHS
# ============================================================================
documentation:
  root_directory: "${DOCS_ROOT_DIR}"
  
  project_docs:
    readme: "${README_PATH}"
    changelog: "${CHANGELOG_PATH}"
    contributing: "${CONTRIBUTING_PATH}"
    license: "${LICENSE_PATH}"
    
  technical_docs:
    architecture: "${ARCHITECTURE_DOC_PATH}"
    api_reference: "${API_REFERENCE_PATH}"
    database_schema: "${DB_SCHEMA_DOC_PATH}"
    deployment_guide: "${DEPLOYMENT_GUIDE_PATH}"
    
  user_docs:
    user_guide: "${USER_GUIDE_PATH}"
    installation: "${INSTALLATION_DOC_PATH}"
    troubleshooting: "${TROUBLESHOOTING_PATH}"
    
  code_docs:
    auto_generate: ${AUTO_GENERATE_DOCS}
    tool: "${DOCS_GENERATION_TOOL}"  # sphinx | mkdocs | pdoc
    output_format: "${DOCS_OUTPUT_FORMAT}"  # html | pdf | markdown
    output_directory: "${DOCS_OUTPUT_DIR}"

# ============================================================================
# SECRETS PLACEHOLDERS
# ============================================================================
# DO NOT STORE ACTUAL SECRETS IN THIS FILE
# Reference secrets from secure storage (environment variables, vault, etc.)
secrets:
  database:
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    host: "${DB_HOST}"
    port: ${DB_PORT}
    name: "${DB_NAME}"
    
  api_keys:
    third_party_service_1: "${API_KEY_SERVICE_1}"
    third_party_service_2: "${API_KEY_SERVICE_2}"
    
  authentication:
    secret_key: "${AUTH_SECRET_KEY}"
    jwt_secret: "${JWT_SECRET_KEY}"
    
  cloud_provider:
    access_key_id: "${CLOUD_ACCESS_KEY_ID}"
    secret_access_key: "${CLOUD_SECRET_ACCESS_KEY}"
    
  encryption:
    encryption_key: "${ENCRYPTION_KEY}"
    
  external_services:
    email_service_api_key: "${EMAIL_API_KEY}"
    payment_gateway_key: "${PAYMENT_GATEWAY_KEY}"

# ============================================================================
# END OF CONFIGURATION
# ============================================================================
