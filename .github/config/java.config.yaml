# Java Project Configuration Template
# Version: 1.0
# Last Updated: 2026-02-09
# Description: Zero hardcoded values configuration for Java projects
# Usage: Copy and customize for each Java project in AgentBase

# ============================================================================
# PROJECT METADATA
# ============================================================================
project:
  id: "${PROJECT_ID}"  # Unique project identifier (e.g., proj_20260209_154530)
  name: "${PROJECT_NAME}"  # Human-readable project name
  type: "${PROJECT_TYPE}"  # POC | Prototype | MVP | Production | Handover
  language: "java"
  framework: "${JAVA_FRAMEWORK}"  # spring-boot | quarkus | micronaut | jakarta-ee | none
  build_tool: "${BUILD_TOOL}"  # maven | gradle
  version: "${PROJECT_VERSION}"  # Semantic versioning (e.g., 1.0.0)
  description: "${PROJECT_DESCRIPTION}"
  created_date: "${PROJECT_CREATED_DATE}"  # ISO 8601 format
  owner: "${PROJECT_OWNER}"
  team_size: ${TEAM_SIZE}  # Number of agents assigned
  priority: "${PROJECT_PRIORITY}"  # low | medium | high | critical
  packaging: "${PACKAGING_TYPE}"  # jar | war | ear

# ============================================================================
# AGENT SETTINGS
# ============================================================================
agents:
  orchestrator:
    enabled: true
    role: "Project Lifecycle Manager"
    authority_level: "full"
    
  development:
    backend_developer:
      enabled: ${BACKEND_AGENT_ENABLED}
      role: "Back-End Developer"
      responsibilities:
        - "Enterprise Java development"
        - "REST API implementation"
        - "Business logic development"
    
  architecture:
    technical_architect:
      enabled: ${ARCHITECT_AGENT_ENABLED}
      role: "Technical Architect"
      consultation_required: ${ARCHITECT_CONSULTATION_REQUIRED}
      
    database_architect:
      enabled: ${DB_ARCHITECT_AGENT_ENABLED}
      role: "Database Architect"
      consultation_required: ${DB_ARCHITECT_CONSULTATION_REQUIRED}
      
  operations:
    devops_engineer:
      enabled: ${DEVOPS_AGENT_ENABLED}
      role: "DevOps Engineer"
      
    security_engineer:
      enabled: ${SECURITY_AGENT_ENABLED}
      role: "Security Engineer"
      consultation_required: true
      
  quality:
    qa_engineer:
      enabled: ${QA_AGENT_ENABLED}
      role: "QA-Test Engineer"
      
  data:
    data_engineer:
      enabled: ${DATA_ENGINEER_ENABLED}
      role: "Data Engineer"

# ============================================================================
# PHASE DEFINITIONS
# ============================================================================
phases:
  phase_1_planning:
    name: "Planning & Requirements"
    duration_estimate: "${PHASE_1_DURATION}"
    deliverables:
      - "${DELIVERABLE_PRD}"
      - "${DELIVERABLE_CHARTER}"
      - "${DELIVERABLE_ARCHITECTURE}"
    agents_required:
      - "Project Lifecycle Manager"
      - "${PHASE_1_AGENT_1}"
      
  phase_2_design:
    name: "Design & Architecture"
    duration_estimate: "${PHASE_2_DURATION}"
    deliverables:
      - "${DELIVERABLE_SYSTEM_DESIGN}"
      - "${DELIVERABLE_DB_SCHEMA}"
      - "${DELIVERABLE_API_SPEC}"
    agents_required:
      - "Technical Architect"
      - "${PHASE_2_AGENT_1}"
      
  phase_3_implementation:
    name: "Implementation"
    duration_estimate: "${PHASE_3_DURATION}"
    deliverables:
      - "${DELIVERABLE_SOURCE_CODE}"
      - "${DELIVERABLE_TESTS}"
      - "${DELIVERABLE_DOCUMENTATION}"
    agents_required:
      - "Back-End Developer"
      - "${PHASE_3_AGENT_1}"
      
  phase_4_testing:
    name: "Testing & QA"
    duration_estimate: "${PHASE_4_DURATION}"
    deliverables:
      - "${DELIVERABLE_TEST_RESULTS}"
      - "${DELIVERABLE_QA_REPORT}"
    agents_required:
      - "QA-Test Engineer"
      
  phase_5_deployment:
    name: "Deployment & Handover"
    duration_estimate: "${PHASE_5_DURATION}"
    deliverables:
      - "${DELIVERABLE_DEPLOYMENT_GUIDE}"
      - "${DELIVERABLE_RUNBOOK}"
    agents_required:
      - "DevOps Engineer"

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
environments:
  development:
    name: "dev"
    java_version: "${JAVA_VERSION_DEV}"  # e.g., 11 | 17 | 21
    jvm_options: "${JVM_OPTIONS_DEV}"
    spring_profiles: "${SPRING_PROFILES_DEV}"
    debug_mode: ${DEBUG_MODE_DEV}
    log_level: "${LOG_LEVEL_DEV}"  # TRACE | DEBUG | INFO | WARN | ERROR
    database_url: "${DATABASE_URL_DEV}"
    redis_url: "${REDIS_URL_DEV}"
    api_base_url: "${API_BASE_URL_DEV}"
    hot_reload: ${HOT_RELOAD_DEV}
    
  staging:
    name: "staging"
    java_version: "${JAVA_VERSION_STAGING}"
    jvm_options: "${JVM_OPTIONS_STAGING}"
    spring_profiles: "${SPRING_PROFILES_STAGING}"
    debug_mode: ${DEBUG_MODE_STAGING}
    log_level: "${LOG_LEVEL_STAGING}"
    database_url: "${DATABASE_URL_STAGING}"
    redis_url: "${REDIS_URL_STAGING}"
    api_base_url: "${API_BASE_URL_STAGING}"
    hot_reload: false
    
  production:
    name: "prod"
    java_version: "${JAVA_VERSION_PROD}"
    jvm_options: "${JVM_OPTIONS_PROD}"
    spring_profiles: "${SPRING_PROFILES_PROD}"
    debug_mode: false
    log_level: "${LOG_LEVEL_PROD}"  # Should be WARN or ERROR
    database_url: "${DATABASE_URL_PROD}"
    redis_url: "${REDIS_URL_PROD}"
    api_base_url: "${API_BASE_URL_PROD}"
    hot_reload: false

# ============================================================================
# BUILD SETTINGS
# ============================================================================
build:
  maven:
    enabled: ${MAVEN_ENABLED}
    pom_file: "${POM_FILE_PATH}"
    settings_file: "${MAVEN_SETTINGS_PATH}"
    repository_url: "${MAVEN_REPO_URL}"
    goals: "${MAVEN_GOALS}"  # clean install | package
    profiles: "${MAVEN_PROFILES}"
    offline_mode: ${MAVEN_OFFLINE}
    
  gradle:
    enabled: ${GRADLE_ENABLED}
    build_file: "${GRADLE_BUILD_FILE}"
    settings_file: "${GRADLE_SETTINGS_FILE}"
    tasks: "${GRADLE_TASKS}"  # clean build | bootJar
    daemon: ${GRADLE_DAEMON_ENABLED}
    parallel: ${GRADLE_PARALLEL_ENABLED}
    
  java_compiler:
    source_version: "${JAVA_SOURCE_VERSION}"
    target_version: "${JAVA_TARGET_VERSION}"
    encoding: "${SOURCE_ENCODING}"  # UTF-8
    release: ${JAVA_RELEASE_VERSION}
    
  dependencies:
    scope: "${DEPENDENCY_SCOPE}"  # compile | runtime | test | provided
    update_policy: "${DEPENDENCY_UPDATE_POLICY}"
    
  static_analysis:
    checkstyle:
      enabled: ${CHECKSTYLE_ENABLED}
      config_file: "${CHECKSTYLE_CONFIG_PATH}"
      fail_on_violation: ${CHECKSTYLE_FAIL_ON_VIOLATION}
      
    pmd:
      enabled: ${PMD_ENABLED}
      ruleset_file: "${PMD_RULESET_PATH}"
      
    spotbugs:
      enabled: ${SPOTBUGS_ENABLED}
      effort: "${SPOTBUGS_EFFORT}"  # min | default | max
      threshold: "${SPOTBUGS_THRESHOLD}"  # low | medium | high
      
  code_formatting:
    tool: "${FORMATTER_TOOL}"  # google-java-format | eclipse | prettier-java
    config_file: "${FORMATTER_CONFIG_PATH}"
    
  annotation_processing:
    enabled: ${ANNOTATION_PROCESSING_ENABLED}
    processors: "${ANNOTATION_PROCESSORS}"
    
  resources:
    filtering: ${RESOURCE_FILTERING_ENABLED}
    directory: "${RESOURCES_DIR}"
    
  output:
    directory: "${BUILD_OUTPUT_DIR}"  # target | build
    final_name: "${FINAL_ARTIFACT_NAME}"

# ============================================================================
# TESTING CONFIGURATION
# ============================================================================
testing:
  framework: "${TEST_FRAMEWORK}"  # junit5 | junit4 | testng
  
  coverage:
    tool: "${COVERAGE_TOOL}"  # jacoco | cobertura
    
    # Coverage requirements by project type
    requirements:
      POC: ${COVERAGE_POC}  # 85%
      Prototype: ${COVERAGE_PROTOTYPE}  # 90%
      MVP: ${COVERAGE_MVP}  # 95%
      Production: ${COVERAGE_PRODUCTION}  # 95%
      Handover: ${COVERAGE_HANDOVER}  # 95%
      
    current_requirement: ${COVERAGE_CURRENT_REQUIREMENT}
    report_format: "${COVERAGE_REPORT_FORMAT}"  # html | xml | csv
    output_dir: "${COVERAGE_OUTPUT_DIR}"
    thresholds:
      line_coverage: ${COVERAGE_THRESHOLD_LINES}
      branch_coverage: ${COVERAGE_THRESHOLD_BRANCHES}
      class_coverage: ${COVERAGE_THRESHOLD_CLASSES}
      method_coverage: ${COVERAGE_THRESHOLD_METHODS}
    
  unit_tests:
    directory: "${UNIT_TEST_DIR}"
    pattern: "${UNIT_TEST_PATTERN}"  # **/*Test.java | **/*Tests.java
    parallel_execution: ${UNIT_TEST_PARALLEL}
    fork_count: "${UNIT_TEST_FORK_COUNT}"
    
  integration_tests:
    directory: "${INTEGRATION_TEST_DIR}"
    pattern: "${INTEGRATION_TEST_PATTERN}"  # **/*IT.java
    requires_database: ${INTEGRATION_TEST_DB_REQUIRED}
    spring_boot_test: ${SPRING_BOOT_TEST_ENABLED}
    
  performance_tests:
    enabled: ${PERFORMANCE_TEST_ENABLED}
    tool: "${PERFORMANCE_TEST_TOOL}"  # jmeter | gatling
    directory: "${PERFORMANCE_TEST_DIR}"
    
  mocking:
    library: "${MOCKING_LIBRARY}"  # mockito | easymock | jmockit
    
  test_containers:
    enabled: ${TEST_CONTAINERS_ENABLED}
    containers: "${TEST_CONTAINER_IMAGES}"
    
  assertions:
    library: "${ASSERTION_LIBRARY}"  # assertj | hamcrest | junit-assertions

# ============================================================================
# DEPLOYMENT CONFIGURATION
# ============================================================================
deployment:
  platform: "${DEPLOYMENT_PLATFORM}"  # aws | gcp | azure | kubernetes | tomcat
  
  containerization:
    enabled: ${DOCKER_ENABLED}
    dockerfile_path: "${DOCKERFILE_PATH}"
    base_image: "${DOCKER_BASE_IMAGE}"  # openjdk | eclipse-temurin
    image_name: "${DOCKER_IMAGE_NAME}"
    image_tag: "${DOCKER_IMAGE_TAG}"
    registry_url: "${DOCKER_REGISTRY_URL}"
    multi_stage_build: ${DOCKER_MULTI_STAGE}
    
  orchestration:
    tool: "${ORCHESTRATION_TOOL}"  # kubernetes | docker-compose | openshift
    config_path: "${ORCHESTRATION_CONFIG_PATH}"
    namespace: "${K8S_NAMESPACE}"
    
  application_server:
    type: "${APP_SERVER_TYPE}"  # embedded | tomcat | wildfly | websphere | weblogic
    version: "${APP_SERVER_VERSION}"
    port: ${APP_SERVER_PORT}
    context_path: "${CONTEXT_PATH}"
    
  jvm_configuration:
    heap_size_min: "${JVM_HEAP_MIN}"  # -Xms
    heap_size_max: "${JVM_HEAP_MAX}"  # -Xmx
    metaspace_size: "${JVM_METASPACE_SIZE}"
    gc_algorithm: "${GC_ALGORITHM}"  # G1GC | ZGC | ParallelGC
    jvm_args: "${ADDITIONAL_JVM_ARGS}"
    
  database_migrations:
    tool: "${MIGRATION_TOOL}"  # flyway | liquibase
    location: "${MIGRATIONS_LOCATION}"
    baseline_on_migrate: ${BASELINE_ON_MIGRATE}
    validate_on_migrate: ${VALIDATE_ON_MIGRATE}
    
  health_check:
    endpoint: "${HEALTH_CHECK_ENDPOINT}"  # /actuator/health
    interval: ${HEALTH_CHECK_INTERVAL}
    timeout: ${HEALTH_CHECK_TIMEOUT}
    
  actuator:
    enabled: ${ACTUATOR_ENABLED}
    port: ${ACTUATOR_PORT}
    base_path: "${ACTUATOR_BASE_PATH}"
    endpoints_enabled: "${ACTUATOR_ENDPOINTS}"

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging:
  base_directory: "logs/${PROJECT_ID}"
  
  phase_logging:
    enabled: true
    pattern: "logs/${PROJECT_ID}/phase_${PHASE_NUMBER}_${PHASE_NAME}/"
    
  framework: "${LOGGING_FRAMEWORK}"  # logback | log4j2 | slf4j
  config_file: "${LOGGING_CONFIG_PATH}"
  
  levels:
    root: "${LOG_LEVEL_ROOT}"
    app: "${LOG_LEVEL_APP}"
    springframework: "${LOG_LEVEL_SPRING}"
    hibernate: "${LOG_LEVEL_HIBERNATE}"
    sql: "${LOG_LEVEL_SQL}"
    jdbc: "${LOG_LEVEL_JDBC}"
    
  appenders:
    console:
      enabled: ${LOG_CONSOLE_ENABLED}
      pattern: "${LOG_CONSOLE_PATTERN}"
      
    file:
      enabled: ${LOG_FILE_ENABLED}
      path: "${LOG_FILE_PATH}"
      pattern: "${LOG_FILE_PATTERN}"
      rolling_policy: "${LOG_ROLLING_POLICY}"  # time-based | size-based
      max_file_size: "${LOG_MAX_FILE_SIZE}"
      max_history: ${LOG_MAX_HISTORY}
      total_size_cap: "${LOG_TOTAL_SIZE_CAP}"
      
    async:
      enabled: ${ASYNC_LOGGING_ENABLED}
      queue_size: ${ASYNC_LOG_QUEUE_SIZE}
      
  structured_logging:
    enabled: ${STRUCTURED_LOGGING_ENABLED}
    format: "${STRUCTURED_LOG_FORMAT}"  # json | logstash
    
  mdc:
    enabled: ${MDC_ENABLED}
    correlation_id_key: "${MDC_CORRELATION_ID_KEY}"
    user_id_key: "${MDC_USER_ID_KEY}"
    
  access_logs:
    enabled: ${ACCESS_LOG_ENABLED}
    pattern: "${ACCESS_LOG_PATTERN}"
    file: "${ACCESS_LOG_FILE}"

# ============================================================================
# SECURITY SETTINGS
# ============================================================================
security:
  dependency_scanning:
    tool: "${DEPENDENCY_SCAN_TOOL}"  # owasp-dependency-check | snyk
    schedule: "${DEPENDENCY_SCAN_SCHEDULE}"
    fail_on_vulnerability: ${FAIL_ON_VULNERABILITY}
    cvss_threshold: ${CVSS_THRESHOLD}
    
  static_application_security_testing:
    tool: "${SAST_TOOL}"  # spotbugs-security | findsecbugs | semgrep
    config_path: "${SAST_CONFIG_PATH}"
    
  secrets_management:
    provider: "${SECRETS_PROVIDER}"  # vault | aws-secrets | azure-keyvault | spring-cloud-config
    config_path: "${SECRETS_CONFIG_PATH}"
    
  spring_security:
    enabled: ${SPRING_SECURITY_ENABLED}
    authentication: "${AUTH_MECHANISM}"  # jwt | oauth2 | basic | form
    authorization: "${AUTHZ_METHOD}"  # role-based | permission-based
    cors_enabled: ${CORS_ENABLED}
    csrf_enabled: ${CSRF_ENABLED}
    
  cors:
    allowed_origins: "${CORS_ALLOWED_ORIGINS}"
    allowed_methods: "${CORS_ALLOWED_METHODS}"
    allowed_headers: "${CORS_ALLOWED_HEADERS}"
    max_age: ${CORS_MAX_AGE}
    
  ssl_tls:
    enabled: ${SSL_ENABLED}
    keystore_path: "${KEYSTORE_PATH}"
    keystore_password: "${KEYSTORE_PASSWORD}"
    key_alias: "${KEY_ALIAS}"
    protocol: "${SSL_PROTOCOL}"  # TLSv1.2 | TLSv1.3
    
  input_validation:
    framework: "${VALIDATION_FRAMEWORK}"  # javax.validation | hibernate-validator
    fail_fast: ${VALIDATION_FAIL_FAST}

# ============================================================================
# CODE QUALITY SETTINGS
# ============================================================================
code_quality:
  formatting:
    enforce: ${ENFORCE_FORMATTING}
    style_guide: "${STYLE_GUIDE}"  # google | oracle | custom
    
  linting:
    enabled: ${LINTING_ENABLED}
    tools:
      - "checkstyle"
      - "${LINTING_TOOL_2}"
    
  complexity:
    max_complexity: ${MAX_COMPLEXITY}  # Cyclomatic complexity
    max_method_lines: ${MAX_METHOD_LINES}
    max_class_lines: ${MAX_CLASS_LINES}
    max_parameters: ${MAX_PARAMETERS}
    
  documentation:
    javadoc_required: ${JAVADOC_REQUIRED}
    min_coverage: ${MIN_JAVADOC_COVERAGE}
    scope: "${JAVADOC_SCOPE}"  # public | protected | private
    
  code_duplication:
    tool: "${DUPLICATION_TOOL}"  # cpd | simian
    min_tokens: ${MIN_DUPLICATE_TOKENS}
    
  dependency_analysis:
    unused_dependencies: ${CHECK_UNUSED_DEPENDENCIES}
    dependency_convergence: ${CHECK_DEPENDENCY_CONVERGENCE}

# ============================================================================
# DOCUMENTATION PATHS
# ============================================================================
documentation:
  root_directory: "${DOCS_ROOT_DIR}"
  
  project_docs:
    readme: "${README_PATH}"
    changelog: "${CHANGELOG_PATH}"
    contributing: "${CONTRIBUTING_PATH}"
    license: "${LICENSE_PATH}"
    
  technical_docs:
    architecture: "${ARCHITECTURE_DOC_PATH}"
    api_reference: "${API_REFERENCE_PATH}"
    database_schema: "${DB_SCHEMA_DOC_PATH}"
    deployment_guide: "${DEPLOYMENT_GUIDE_PATH}"
    
  javadoc:
    auto_generate: ${AUTO_GENERATE_JAVADOC}
    output_directory: "${JAVADOC_OUTPUT_DIR}"
    include_private: ${JAVADOC_INCLUDE_PRIVATE}
    link_source: ${JAVADOC_LINK_SOURCE}
    
  api_documentation:
    tool: "${API_DOCS_TOOL}"  # springdoc-openapi | swagger
    path: "${API_DOCS_PATH}"  # /swagger-ui.html | /api-docs

# ============================================================================
# SECRETS PLACEHOLDERS
# ============================================================================
# DO NOT STORE ACTUAL SECRETS IN THIS FILE
secrets:
  database:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver_class: "${DB_DRIVER_CLASS}"
    
  datasource:
    hikari_max_pool_size: ${HIKARI_MAX_POOL_SIZE}
    hikari_min_idle: ${HIKARI_MIN_IDLE}
    
  api_keys:
    external_service_1: "${API_KEY_SERVICE_1}"
    external_service_2: "${API_KEY_SERVICE_2}"
    
  jwt:
    secret_key: "${JWT_SECRET_KEY}"
    expiration_ms: ${JWT_EXPIRATION_MS}
    
  oauth2:
    client_id: "${OAUTH2_CLIENT_ID}"
    client_secret: "${OAUTH2_CLIENT_SECRET}"
    
  cloud_provider:
    access_key: "${CLOUD_ACCESS_KEY}"
    secret_key: "${CLOUD_SECRET_KEY}"
    region: "${CLOUD_REGION}"
    
  encryption:
    key: "${ENCRYPTION_KEY}"
    algorithm: "${ENCRYPTION_ALGORITHM}"

# ============================================================================
# END OF CONFIGURATION
# ============================================================================
