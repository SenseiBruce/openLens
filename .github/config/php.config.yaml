# PHP Project Configuration Template
# Version: 1.0
# Last Updated: 2026-02-09
# Description: Zero hardcoded values configuration for PHP projects
# Usage: Copy and customize for each PHP project in AgentBase

# ============================================================================
# PROJECT METADATA
# ============================================================================
project:
  id: "${PROJECT_ID}"  # Unique project identifier (e.g., proj_20260209_154530)
  name: "${PROJECT_NAME}"  # Human-readable project name
  type: "${PROJECT_TYPE}"  # POC | Prototype | MVP | Production | Handover
  language: "php"
  php_version: "${PHP_VERSION}"  # 8.1 | 8.2 | 8.3 | 8.4
  framework: "${PHP_FRAMEWORK}"  # laravel | symfony | codeigniter | slim | lumen | none
  version: "${PROJECT_VERSION}"  # Semantic versioning (e.g., 1.0.0)
  description: "${PROJECT_DESCRIPTION}"
  created_date: "${PROJECT_CREATED_DATE}"  # ISO 8601 format
  owner: "${PROJECT_OWNER}"
  team_size: ${TEAM_SIZE}  # Number of agents assigned
  priority: "${PROJECT_PRIORITY}"  # low | medium | high | critical

# ============================================================================
# AGENT SETTINGS
# ============================================================================
agents:
  orchestrator:
    enabled: true
    role: "Project Lifecycle Manager"
    authority_level: "full"
    
  development:
    backend_developer:
      enabled: ${BACKEND_AGENT_ENABLED}
      role: "Back-End Developer"
      responsibilities:
        - "API development"
        - "Business logic implementation"
        - "Database integration"
    
    frontend_developer:
      enabled: ${FRONTEND_AGENT_ENABLED}
      role: "Front-End Developer"
      responsibilities:
        - "View templates"
        - "Frontend assets"
    
  architecture:
    technical_architect:
      enabled: ${ARCHITECT_AGENT_ENABLED}
      role: "Technical Architect"
      consultation_required: ${ARCHITECT_CONSULTATION_REQUIRED}
      
    database_architect:
      enabled: ${DB_ARCHITECT_AGENT_ENABLED}
      role: "Database Architect"
      consultation_required: ${DB_ARCHITECT_CONSULTATION_REQUIRED}
      
  operations:
    devops_engineer:
      enabled: ${DEVOPS_AGENT_ENABLED}
      role: "DevOps Engineer"
      
    security_engineer:
      enabled: ${SECURITY_AGENT_ENABLED}
      role: "Security Engineer"
      consultation_required: true
      
  quality:
    qa_engineer:
      enabled: ${QA_AGENT_ENABLED}
      role: "QA-Test Engineer"
      
  data:
    data_engineer:
      enabled: ${DATA_ENGINEER_ENABLED}
      role: "Data Engineer"
      
    data_scientist:
      enabled: ${DATA_SCIENTIST_ENABLED}
      role: "Data Scientist"

# ============================================================================
# PHASE DEFINITIONS
# ============================================================================
phases:
  phase_1_planning:
    name: "Planning & Requirements"
    duration_estimate: "${PHASE_1_DURATION}"
    deliverables:
      - "${DELIVERABLE_PRD}"
      - "${DELIVERABLE_CHARTER}"
      - "${DELIVERABLE_ARCHITECTURE}"
    agents_required:
      - "Project Lifecycle Manager"
      - "${PHASE_1_AGENT_1}"
      - "${PHASE_1_AGENT_2}"
      
  phase_2_design:
    name: "Design & Architecture"
    duration_estimate: "${PHASE_2_DURATION}"
    deliverables:
      - "${DELIVERABLE_SYSTEM_DESIGN}"
      - "${DELIVERABLE_DB_SCHEMA}"
      - "${DELIVERABLE_API_SPEC}"
    agents_required:
      - "Technical Architect"
      - "${PHASE_2_AGENT_1}"
      
  phase_3_implementation:
    name: "Implementation"
    duration_estimate: "${PHASE_3_DURATION}"
    deliverables:
      - "${DELIVERABLE_SOURCE_CODE}"
      - "${DELIVERABLE_TESTS}"
      - "${DELIVERABLE_DOCUMENTATION}"
    agents_required:
      - "Back-End Developer"
      - "${PHASE_3_AGENT_1}"
      - "${PHASE_3_AGENT_2}"
      
  phase_4_testing:
    name: "Testing & QA"
    duration_estimate: "${PHASE_4_DURATION}"
    deliverables:
      - "${DELIVERABLE_TEST_RESULTS}"
      - "${DELIVERABLE_QA_REPORT}"
    agents_required:
      - "QA-Test Engineer"
      
  phase_5_deployment:
    name: "Deployment & Handover"
    duration_estimate: "${PHASE_5_DURATION}"
    deliverables:
      - "${DELIVERABLE_DEPLOYMENT_GUIDE}"
      - "${DELIVERABLE_RUNBOOK}"
    agents_required:
      - "DevOps Engineer"

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
environments:
  development:
    name: "dev"
    php_version: "${PHP_VERSION_DEV}"
    app_env: "local"
    debug_mode: ${DEBUG_MODE_DEV}
    error_reporting: "${ERROR_REPORTING_DEV}"  # E_ALL | E_ERROR | E_WARNING
    display_errors: ${DISPLAY_ERRORS_DEV}
    log_level: "${LOG_LEVEL_DEV}"  # debug | info | notice | warning | error
    database_url: "${DATABASE_URL_DEV}"
    redis_url: "${REDIS_URL_DEV}"
    api_base_url: "${API_BASE_URL_DEV}"
    cache_driver: "${CACHE_DRIVER_DEV}"  # file | redis | memcached
    
  staging:
    name: "staging"
    php_version: "${PHP_VERSION_STAGING}"
    app_env: "staging"
    debug_mode: ${DEBUG_MODE_STAGING}
    error_reporting: "${ERROR_REPORTING_STAGING}"
    display_errors: ${DISPLAY_ERRORS_STAGING}
    log_level: "${LOG_LEVEL_STAGING}"
    database_url: "${DATABASE_URL_STAGING}"
    redis_url: "${REDIS_URL_STAGING}"
    api_base_url: "${API_BASE_URL_STAGING}"
    cache_driver: "${CACHE_DRIVER_STAGING}"
    
  production:
    name: "prod"
    php_version: "${PHP_VERSION_PROD}"
    app_env: "production"
    debug_mode: false
    error_reporting: "E_ERROR"
    display_errors: false
    log_level: "${LOG_LEVEL_PROD}"  # Should be warning or error
    database_url: "${DATABASE_URL_PROD}"
    redis_url: "${REDIS_URL_PROD}"
    api_base_url: "${API_BASE_URL_PROD}"
    cache_driver: "${CACHE_DRIVER_PROD}"

# ============================================================================
# BUILD SETTINGS
# ============================================================================
build:
  package_manager: "composer"
  composer_file: "${COMPOSER_JSON_PATH}"
  composer_lock: "${COMPOSER_LOCK_PATH}"
  
  composer:
    version: "${COMPOSER_VERSION}"
    install_flags: "${COMPOSER_INSTALL_FLAGS}"  # --no-dev --optimize-autoloader
    update_flags: "${COMPOSER_UPDATE_FLAGS}"
    platform_version: "${COMPOSER_PLATFORM_VERSION}"
    
  php_extensions:
    required:
      - "${PHP_EXT_1}"  # pdo | mysqli | mbstring | openssl
      - "${PHP_EXT_2}"
      - "${PHP_EXT_3}"
    optional:
      - "${PHP_EXT_OPTIONAL_1}"  # redis | xdebug | opcache
      
  php_ini:
    memory_limit: "${PHP_MEMORY_LIMIT}"
    max_execution_time: ${PHP_MAX_EXECUTION_TIME}
    upload_max_filesize: "${PHP_UPLOAD_MAX_FILESIZE}"
    post_max_size: "${PHP_POST_MAX_SIZE}"
    
  static_analysis:
    phpstan:
      enabled: ${PHPSTAN_ENABLED}
      config_file: "${PHPSTAN_CONFIG_PATH}"
      level: ${PHPSTAN_LEVEL}  # 0-9
      
    psalm:
      enabled: ${PSALM_ENABLED}
      config_file: "${PSALM_CONFIG_PATH}"
      error_level: ${PSALM_ERROR_LEVEL}  # 1-8
      
    php_cs_fixer:
      enabled: ${PHP_CS_FIXER_ENABLED}
      config_file: "${PHP_CS_FIXER_CONFIG_PATH}"
      rules: "${PHP_CS_FIXER_RULES}"
      
    phpmd:
      enabled: ${PHPMD_ENABLED}
      ruleset: "${PHPMD_RULESET_PATH}"
      
  pre_build_commands:
    - "${PRE_BUILD_CMD_1}"
    - "${PRE_BUILD_CMD_2}"
    
  post_build_commands:
    - "${POST_BUILD_CMD_1}"
    - "${POST_BUILD_CMD_2}"

# ============================================================================
# TESTING CONFIGURATION
# ============================================================================
testing:
  framework: "${TEST_FRAMEWORK}"  # phpunit | pest | codeception | behat
  
  coverage:
    tool: "${COVERAGE_TOOL}"  # phpunit | pcov | xdebug
    
    # Coverage requirements by project type
    requirements:
      POC: ${COVERAGE_POC}  # 85%
      Prototype: ${COVERAGE_PROTOTYPE}  # 90%
      MVP: ${COVERAGE_MVP}  # 95%
      Production: ${COVERAGE_PRODUCTION}  # 95%
      Handover: ${COVERAGE_HANDOVER}  # 95%
      
    current_requirement: ${COVERAGE_CURRENT_REQUIREMENT}
    report_format: "${COVERAGE_REPORT_FORMAT}"  # html | clover | xml | text
    output_dir: "${COVERAGE_OUTPUT_DIR}"
    
  unit_tests:
    directory: "${UNIT_TEST_DIR}"
    pattern: "${UNIT_TEST_PATTERN}"  # *Test.php
    parallel_execution: ${UNIT_TEST_PARALLEL}
    bootstrap_file: "${UNIT_TEST_BOOTSTRAP}"
    
  integration_tests:
    directory: "${INTEGRATION_TEST_DIR}"
    pattern: "${INTEGRATION_TEST_PATTERN}"
    requires_database: ${INTEGRATION_TEST_DB_REQUIRED}
    
  feature_tests:
    enabled: ${FEATURE_TEST_ENABLED}
    directory: "${FEATURE_TEST_DIR}"
    
  performance_tests:
    enabled: ${PERFORMANCE_TEST_ENABLED}
    directory: "${PERFORMANCE_TEST_DIR}"
    
  fixtures:
    directory: "${FIXTURES_DIR}"
    
  factories:
    library: "${FACTORY_LIBRARY}"  # faker | factory-bot
    directory: "${FACTORIES_DIR}"
    
  mocking:
    library: "${MOCKING_LIBRARY}"  # mockery | prophecy | phpunit-mock

# ============================================================================
# DEPLOYMENT CONFIGURATION
# ============================================================================
deployment:
  platform: "${DEPLOYMENT_PLATFORM}"  # aws | heroku | digitalocean | docker | kubernetes
  
  containerization:
    enabled: ${DOCKER_ENABLED}
    dockerfile_path: "${DOCKERFILE_PATH}"
    base_image: "${DOCKER_BASE_IMAGE}"  # php:8.3-fpm-alpine
    image_name: "${DOCKER_IMAGE_NAME}"
    image_tag: "${DOCKER_IMAGE_TAG}"
    registry_url: "${DOCKER_REGISTRY_URL}"
    
  orchestration:
    tool: "${ORCHESTRATION_TOOL}"  # kubernetes | docker-compose
    config_path: "${ORCHESTRATION_CONFIG_PATH}"
    
  web_server:
    type: "${WEB_SERVER_TYPE}"  # nginx | apache | caddy
    config_path: "${WEB_SERVER_CONFIG_PATH}"
    document_root: "${DOCUMENT_ROOT}"
    
  php_fpm:
    enabled: ${PHP_FPM_ENABLED}
    config_path: "${PHP_FPM_CONFIG_PATH}"
    pool_config: "${PHP_FPM_POOL_CONFIG}"
    max_children: ${PHP_FPM_MAX_CHILDREN}
    start_servers: ${PHP_FPM_START_SERVERS}
    
  opcache:
    enabled: ${OPCACHE_ENABLED}
    memory_consumption: ${OPCACHE_MEMORY}
    max_accelerated_files: ${OPCACHE_MAX_FILES}
    validate_timestamps: ${OPCACHE_VALIDATE_TIMESTAMPS}
    
  assets:
    public_directory: "${ASSETS_PUBLIC_DIR}"
    compile_command: "${ASSETS_COMPILE_CMD}"
    cdn_url: "${ASSETS_CDN_URL}"
    
  database_migrations:
    tool: "${MIGRATION_TOOL}"  # doctrine | laravel | phinx
    directory: "${MIGRATIONS_DIR}"
    auto_migrate: ${AUTO_MIGRATE_ENABLED}
    
  queue_workers:
    enabled: ${QUEUE_WORKERS_ENABLED}
    driver: "${QUEUE_DRIVER}"  # redis | database | beanstalkd | sqs
    workers_count: ${QUEUE_WORKERS_COUNT}
    
  health_check:
    endpoint: "${HEALTH_CHECK_ENDPOINT}"
    interval: ${HEALTH_CHECK_INTERVAL}
    timeout: ${HEALTH_CHECK_TIMEOUT}

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging:
  base_directory: "logs/${PROJECT_ID}"
  
  phase_logging:
    enabled: true
    pattern: "logs/${PROJECT_ID}/phase_${PHASE_NUMBER}_${PHASE_NAME}/"
    
  library: "${LOGGING_LIBRARY}"  # monolog | log4php
  
  levels:
    root: "${LOG_LEVEL_ROOT}"
    app: "${LOG_LEVEL_APP}"
    database: "${LOG_LEVEL_DATABASE}"
    external_apis: "${LOG_LEVEL_EXTERNAL_APIS}"
    
  handlers:
    console:
      enabled: ${LOG_CONSOLE_ENABLED}
      format: "${LOG_CONSOLE_FORMAT}"
      
    file:
      enabled: ${LOG_FILE_ENABLED}
      path: "${LOG_FILE_PATH}"
      format: "${LOG_FILE_FORMAT}"
      rotation: "${LOG_FILE_ROTATION}"  # daily | size-based
      max_size: "${LOG_FILE_MAX_SIZE}"  # e.g., 10MB
      backup_count: ${LOG_FILE_BACKUP_COUNT}
      permission: "${LOG_FILE_PERMISSION}"  # 0644
      
    syslog:
      enabled: ${LOG_SYSLOG_ENABLED}
      facility: "${LOG_SYSLOG_FACILITY}"
      
    error_log:
      enabled: ${ERROR_LOG_ENABLED}
      path: "${ERROR_LOG_PATH}"
      
  structured_logging:
    enabled: ${STRUCTURED_LOGGING_ENABLED}
    format: "${STRUCTURED_LOG_FORMAT}"  # json | line
    
  context:
    include_request_id: ${LOG_INCLUDE_REQUEST_ID}
    include_user_id: ${LOG_INCLUDE_USER_ID}
    include_ip: ${LOG_INCLUDE_IP}

# ============================================================================
# SECURITY SETTINGS
# ============================================================================
security:
  dependency_scanning:
    tool: "${DEPENDENCY_SCAN_TOOL}"  # local-php-security-checker | snyk | composer-audit
    schedule: "${DEPENDENCY_SCAN_SCHEDULE}"
    fail_on_vulnerability: ${FAIL_ON_VULNERABILITY}
    
  static_application_security_testing:
    tool: "${SAST_TOOL}"  # phpcs-security-audit | progpilot | phan
    config_path: "${SAST_CONFIG_PATH}"
    severity_threshold: "${SAST_SEVERITY_THRESHOLD}"  # low | medium | high
    
  secrets_management:
    provider: "${SECRETS_PROVIDER}"  # vault | aws-secrets | dotenv | laravel-env
    config_path: "${SECRETS_CONFIG_PATH}"
    rotation_enabled: ${SECRETS_ROTATION_ENABLED}
    
  authentication:
    method: "${AUTH_METHOD}"  # jwt | oauth2 | session | api-key
    token_expiry: ${AUTH_TOKEN_EXPIRY}
    session_lifetime: ${SESSION_LIFETIME}
    
  csrf_protection:
    enabled: ${CSRF_PROTECTION_ENABLED}
    token_name: "${CSRF_TOKEN_NAME}"
    
  cors:
    enabled: ${CORS_ENABLED}
    allowed_origins: "${CORS_ALLOWED_ORIGINS}"
    allowed_methods: "${CORS_ALLOWED_METHODS}"
    
  rate_limiting:
    enabled: ${RATE_LIMITING_ENABLED}
    requests_per_minute: ${RATE_LIMIT_RPM}
    
  xss_protection:
    enabled: ${XSS_PROTECTION_ENABLED}
    sanitization_library: "${XSS_SANITIZATION_LIBRARY}"  # html-purifier
    
  sql_injection_protection:
    use_prepared_statements: ${USE_PREPARED_STATEMENTS}
    
  input_validation:
    library: "${INPUT_VALIDATION_LIBRARY}"  # symfony-validator | respect-validation
    strict_mode: ${INPUT_VALIDATION_STRICT}

# ============================================================================
# CODE QUALITY SETTINGS
# ============================================================================
code_quality:
  formatting:
    tool: "php-cs-fixer"
    config_file: "${PHP_CS_FIXER_CONFIG}"
    check_only: ${FORMAT_CHECK_ONLY}
    
  linting:
    enabled: ${LINTING_ENABLED}
    tools:
      - "${LINTING_TOOL_1}"
      - "${LINTING_TOOL_2}"
    fail_on_error: ${LINT_FAIL_ON_ERROR}
    
  complexity:
    max_complexity: ${MAX_COMPLEXITY}  # Cyclomatic complexity
    max_method_length: ${MAX_METHOD_LENGTH}
    max_class_length: ${MAX_CLASS_LENGTH}
    max_npath_complexity: ${MAX_NPATH_COMPLEXITY}
    
  documentation:
    format: "${DOCUMENTATION_FORMAT}"  # phpdoc | docblock
    min_coverage: ${MIN_DOCUMENTATION_COVERAGE}
    
  psr_standards:
    enforce_psr1: ${ENFORCE_PSR1}
    enforce_psr2: ${ENFORCE_PSR2}
    enforce_psr12: ${ENFORCE_PSR12}

# ============================================================================
# DOCUMENTATION PATHS
# ============================================================================
documentation:
  root_directory: "${DOCS_ROOT_DIR}"
  
  project_docs:
    readme: "${README_PATH}"
    changelog: "${CHANGELOG_PATH}"
    contributing: "${CONTRIBUTING_PATH}"
    license: "${LICENSE_PATH}"
    
  technical_docs:
    architecture: "${ARCHITECTURE_DOC_PATH}"
    api_reference: "${API_REFERENCE_PATH}"
    database_schema: "${DB_SCHEMA_DOC_PATH}"
    deployment_guide: "${DEPLOYMENT_GUIDE_PATH}"
    
  user_docs:
    user_guide: "${USER_GUIDE_PATH}"
    installation: "${INSTALLATION_DOC_PATH}"
    troubleshooting: "${TROUBLESHOOTING_PATH}"
    
  code_docs:
    auto_generate: ${AUTO_GENERATE_DOCS}
    tool: "${DOCS_GENERATION_TOOL}"  # phpdocumentor | apigen | sami
    output_format: "${DOCS_OUTPUT_FORMAT}"  # html | markdown
    output_directory: "${DOCS_OUTPUT_DIR}"

# ============================================================================
# SECRETS PLACEHOLDERS
# ============================================================================
# DO NOT STORE ACTUAL SECRETS IN THIS FILE
# Reference secrets from secure storage (environment variables, vault, etc.)
secrets:
  database:
    connection: "${DB_CONNECTION}"  # mysql | pgsql | sqlite | sqlsrv
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    host: "${DB_HOST}"
    port: ${DB_PORT}
    name: "${DB_NAME}"
    
  api_keys:
    third_party_service_1: "${API_KEY_SERVICE_1}"
    third_party_service_2: "${API_KEY_SERVICE_2}"
    
  authentication:
    app_key: "${APP_KEY}"
    jwt_secret: "${JWT_SECRET_KEY}"
    session_key: "${SESSION_SECRET_KEY}"
    
  cloud_provider:
    access_key_id: "${CLOUD_ACCESS_KEY_ID}"
    secret_access_key: "${CLOUD_SECRET_ACCESS_KEY}"
    
  encryption:
    encryption_key: "${ENCRYPTION_KEY}"
    cipher: "${ENCRYPTION_CIPHER}"  # AES-256-CBC
    
  external_services:
    smtp_host: "${SMTP_HOST}"
    smtp_port: ${SMTP_PORT}
    smtp_username: "${SMTP_USERNAME}"
    smtp_password: "${SMTP_PASSWORD}"
    redis_password: "${REDIS_PASSWORD}"
    s3_key: "${S3_ACCESS_KEY}"
    s3_secret: "${S3_SECRET_KEY}"

# ============================================================================
# END OF CONFIGURATION
# ============================================================================
