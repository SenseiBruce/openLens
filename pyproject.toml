[tool.pytest.ini_options]
testpaths = ["voicecut/tests"]
pythonpath = ["."]
addopts = "--cov=voicecut --cov-fail-under=50 --cov-report=term-missing"

[tool.coverage.run]
source = ["voicecut"]
omit = [
    "voicecut/tests/*",
    "voicecut/scripts/*",
    "voicecut/web/*",
    "voicecut/monitoring/local_monitor.py",
    "*/voicecut.egg-info/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "voicecut/web",
    "silero-vad",
    "whisperX",
    "auto-editor",
    ".venv",
    "voicecut/.venv",
    "voicecut/monitoring/local_monitor.py",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
