[project]
name = "voicecut"
version = "1.0.0"
description = "AI-powered speech-aware video editor"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "python-multipart>=0.0.6",
    "litellm>=1.98.0",
    "openai>=1.0.0",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "structlog>=24.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["voicecut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "--cov=voicecut --cov-fail-under=70 --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "web",
    "monitoring/local_monitor.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B011", "E402"]
